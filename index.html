    <!--
      September offer — THE dates for the promotion live here and nowhere else.
      Opens at midnight on 1 September and closes at the end of 30 September, so
      the discounted prices are only ever on screen while they can actually be
      claimed.
      Runs before first paint so the space above the nav is already reserved and
      the page never jumps once React hydrates. It has to be a runtime check
      rather than a build-time one: every page is prerendered to static HTML, so
      a date evaluated during the build would be frozen at whenever the site was
      last deployed. Everything else about the offer — the code, the rate, the
      wording — is in src/lib/promo.ts.
    -->
    <script>
      (function () {
        var now = new Date()
        if (now >= new Date(2026, 8, 1) && now < new Date(2026, 9, 1)) {
          document.documentElement.classList.add('has-promo')
        }
      })()
    </script>
    <title>Matthew Knight · Osteopath & Sports Massage Therapist · Orpington</title>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>

  </body>
