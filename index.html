    <!--
      September offer — THE dates for the promotion live here and nowhere else.

        has-promo-soon  29 Aug -> 1 Sept   the offer is announced but not live
        has-promo        1 Sept -> 1 Oct   the offer is running

      Only `has-promo` ever discounts a price, so a half-price figure is on
      screen exactly while it can be claimed; the run-up states the dates
      instead. After 30 September neither class is set and every trace of the
      offer is gone without anyone touching the site.
      Runs before first paint so the space above the nav is already reserved and
      the page never jumps once React hydrates. It has to be a runtime check
      rather than a build-time one: every page is prerendered to static HTML, so
      a date evaluated during the build would be frozen at whenever the site was
      last deployed. Everything else about the offer — the code, the rate, the
      wording — is in src/lib/promo.ts.
    -->
    <script>
      (function () {
        var now = new Date()
        var announceFrom = new Date(2026, 7, 29)
        var offerFrom = new Date(2026, 8, 1)
        var offerUntil = new Date(2026, 9, 1)
        var root = document.documentElement
        if (now >= offerFrom && now < offerUntil) {
          root.classList.add('has-promo')
        } else if (now >= announceFrom && now < offerFrom) {
          root.classList.add('has-promo-soon')
        }
      })()
    </script>
    <title>Matthew Knight · Osteopath & Sports Massage Therapist · Orpington</title>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
